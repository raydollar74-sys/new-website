<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Blog Post | Huanqiu Precious Metal</title>
<link rel="stylesheet" href="css/styles.css"/>
<link rel="stylesheet" href="css/overrides.css"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
</head>
<body class="font-sans">
<header class="bg-black text-white sticky top-0 z-50 shadow-lg">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div>
          <span class="font-bold text-base">HUANQIU</span>
          <span class="text-yellow-500 font-bold text-base"> PRECIOUS METAL</span>
          <p class="text-xs text-gray-400">Trading Limited - Kampala, Uganda</p>

  </nav>

    <article class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="p-6 md:p-8 lg:p-10">

          <p class="text-gray-500">Fetching the article from our blog…</p>
        </div>
        <div class="mt-12 pt-8 border-t border-gray-200 flex items-center gap-3">

          <button id="share-btn" class="p-2 bg-gray-100 rounded-full hover:bg-yellow-100 transition-colors" aria-label="Share article">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>

          <button id="print-btn" class="p-2 bg-gray-100 rounded-full hover:bg-yellow-100 transition-colors" aria-label="Print article">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
          </button>
        </div>
        <div class="mt-8 flex justify-center">
          <a href="contact.html" class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold px-6 py-3 rounded-lg transition-all">Contact Our Team</a>
        </div>
      </div>
    </article>
    <div class="mt-8">
      <a href="blog.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-yellow-600 transition-colors">← Back to all posts</a>
    </div>
  </div>
</section>

<footer class="bg-gray-900 text-white">
  <div class="border-t border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <p class="text-gray-400 text-sm text-center">© <span id="y"></span> Huanqiu Precious Metal Trading Limited - Kampala, Uganda. All rights reserved.</p>
    </div>
  </div>
</footer>
<script src="js/blog.js" defer></script>

</html>
